[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xcstool"
version = "0.1.0"
description = "Split Xcode String Catalogs (.xcstrings) per language and merge them back"
readme = "README.md"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Localization",
]

[project.scripts]
xcstool = "xcstool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100
